services:
  # API FastAPI — Telco Churn Prediction
  api:
    build: .
    container_name: telco_churn_api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - ENV=production
    volumes:
      - ./models:/app/models:ro
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MLflow UI
  mlflow:
    image: python:3.11-slim
    container_name: telco_mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
    command: >
      bash -c "pip install mlflow -q &&
               mlflow ui --host 0.0.0.0 --port 5000 --backend-store-uri /mlruns"
